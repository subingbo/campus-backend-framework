server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    # forceConnectionTimeZoneToSession：让 MySQL 会话时区与应用一致，
    # 否则 mapper 里的 NOW() 会按数据库服务器时区（常见为 UTC）写入，和 Java LocalDateTime.now() 相差 8 小时。
    url: jdbc:mysql://localhost:3306/campus?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
    username: campus
    password: campus123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

campus:
  jwt:
    secret: dev-only-change-me-campus-jwt-secret-key-32bytes-min
    access-token-expiration: 1800
    refresh-token-expiration: 604800
  llm:
    # DashScope OpenAI 兼容模式；真实 key 在 git 忽略的 application-secrets.properties
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}
    model: qwen-plus
  amap:
    # 高德「Web服务」key（区别于前端的 JS API key）；值同上
    web-key: ${AMAP_WEB_KEY:}
  agent:
    trace:
      pricing:
        # 演示费率，不是账单价；请按实际百炼/模型账单更新，并同步 version
        enabled: true
        currency: CNY
        version: "demo-2026-10"
        models:
          qwen-plus:
            input-per-million: 0.8
            output-per-million: 2.0

logging:
  level:
    com.campus: debug
