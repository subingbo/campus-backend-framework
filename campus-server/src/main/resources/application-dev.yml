server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: campus
    password: campus123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

campus:
  jwt:
    secret: dev-only-change-me-campus-jwt-secret-key-32bytes-min
    access-token-expiration: 1800
    refresh-token-expiration: 604800
  llm:
    # DashScope OpenAI 兼容模式；真实 key 在 git 忽略的 application-secrets.properties
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}
    model: qwen-plus
  amap:
    # 高德「Web服务」key（区别于前端的 JS API key）；值同上
    web-key: ${AMAP_WEB_KEY:}

logging:
  level:
    com.campus: debug
