spring:
  application:
    name: campus-server
  profiles:
    active: dev
  # 本地密钥（DASHSCOPE_API_KEY / AMAP_WEB_KEY 等真实值）放在 git 忽略的
  # application-secrets.properties，不入库；环境变量可覆盖
  config:
    import: optional:classpath:application-secrets.properties

mybatis:
  # classpath* 才能同时装载 campus-framework 与 campus-server 两个模块里的 Mapper XML
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

campus:
  agent:
    trace:
      # P0 执行追踪：默认开启；部署前必须先执行 db/migration/20261019_01__create_agent_trace.sql
      enabled: true
      level: SUMMARY          # OFF / SUMMARY / DEBUG（P0 DEBUG 不额外采集原文）
      max-payload-bytes: 16384
      writer:
        queue-capacity: 2000
        batch-size: 50
        flush-timeout-ms: 3000
        critical-offer-timeout-ms: 500
      retention:
        detail-days: 30
        stale-running-minutes: 120
        cleanup-cron: "0 30 3 * * *"
      export:
        enabled: true
        page-size: 500
      # 成本估算：费率由部署方按真实账单维护；未配置模型时显示“不可估算”
      pricing:
        enabled: true
        currency: CNY
        version: config
