spring:
  application:
    name: campus-server
  profiles:
    active: dev
  # 本地密钥（DASHSCOPE_API_KEY / AMAP_WEB_KEY 等真实值）放在 git 忽略的
  # application-secrets.properties，不入库；环境变量可覆盖
  config:
    import: optional:classpath:application-secrets.properties

mybatis:
  # classpath* 才能同时装载 campus-framework 与 campus-server 两个模块里的 Mapper XML
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
