campus:
  jwt:
    secret: test-jwt-secret-key-for-integration-tests-32b
    access-token-expiration: 1800
    refresh-token-expiration: 604800
  agent:
    trace:
      enabled: true
      writer:
        queue-capacity: 10000
        batch-size: 100
        # 并发/1 万事件测试需要等待较多顺序 INSERT；生产默认 3000 不变
        flush-timeout-ms: 15000
      retention:
        cleanup-cron: "0 0 3 * * *"
      pricing:
        enabled: true
        currency: CNY
        version: "test-1"
        models:
          qwen-plus:
            input-per-million: 1.0
            output-per-million: 2.0

springdoc:
  api-docs:
    enabled: false
knife4j:
  enable: false

logging:
  level:
    root: warn
    com.campus: info
