<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>样板 · 地点详情（移动 BottomSheet）</title>
  <link rel="stylesheet" href="./lab.css">
</head>
<body class="lab">
  <div class="map-stage">
    <img class="map-base" src="./map-base.svg" alt="校园地图示意底图">

    <header class="mobile-topbar">
      <button class="icon-btn" type="button" aria-label="返回地图">
        <svg class="icon" aria-hidden="true"><use href="./icons.svg#i-arrow-left"></use></svg>
      </button>
      <span class="brand-name">周末去哪儿</span>
      <span class="avatar">林</span>
    </header>

    <button class="marker is-selected" type="button" style="left:50%;top:24%" data-place-id="1">
      <span class="marker__dot"></span><span class="marker__label">东区图书馆</span>
    </button>
    <button class="marker" type="button" style="left:72%;top:30%" data-place-id="2">
      <span class="marker__dot"></span><span class="marker__label">南门咖啡</span>
    </button>
    <button class="marker" type="button" style="left:28%;top:28%" data-place-id="3">
      <span class="marker__dot"></span><span class="marker__label">西区运动场</span>
    </button>

    <div class="mobile-map-controls mobile-map-controls--detail" aria-label="地图控件">
      <button class="map-control map-control--accent" type="button" aria-label="定位到我">
        <svg class="icon" aria-hidden="true"><use href="./icons.svg#i-crosshair"></use></svg>
      </button>
      <button class="map-control" type="button" aria-label="图层">
        <svg class="icon" aria-hidden="true"><use href="./icons.svg#i-layers"></use></svg>
      </button>
    </div>

    <section class="sheet sheet--detail" aria-label="地点详情">
      <div class="sheet-handle" aria-hidden="true"></div>

      <div class="sheet-body">
        <div class="sheet-detail-head">
          <div class="detail-eyebrow">
            <span class="pill" data-place-category>学习</span>
            <button class="icon-btn" type="button" aria-label="关闭详情">
              <svg class="icon" aria-hidden="true"><use href="./icons.svg#i-x"></use></svg>
            </button>
          </div>
          <h2 class="detail-title" data-place-name>东区图书馆</h2>
          <p class="detail-addr">
            <svg class="icon icon--sm" aria-hidden="true"><use href="./icons.svg#i-pin"></use></svg>
            <span data-place-address>大学城中环东路 178 号</span>
          </p>
          <p class="detail-auth" data-place-auth>由 林晓 添加 · 10 分钟前更新</p>

          <div class="detail-actions">
            <button class="btn btn-primary" type="button">
              <svg class="icon icon--sm" aria-hidden="true"><use href="./icons.svg#i-navigation"></use></svg>
              导航
            </button>
            <button class="btn-icon" type="button" aria-label="地点聊天">
              <svg class="icon" aria-hidden="true"><use href="./icons.svg#i-message"></use></svg>
            </button>
            <button class="btn-icon" type="button" aria-label="分享">
              <svg class="icon" aria-hidden="true"><use href="./icons.svg#i-share"></use></svg>
            </button>
            <button class="btn-icon" type="button" aria-label="更多操作">
              <svg class="icon" aria-hidden="true"><use href="./icons.svg#i-more"></use></svg>
            </button>
          </div>
        </div>

        <div class="sheet-detail-body">
          <p class="detail-desc" data-place-desc>二楼静音区插座多，适合复习和小组讨论；下午三点后靠窗位置更安静。</p>

          <div class="rule"></div>

          <section class="section">
            <div class="section-head">
              <h3 class="section-title">本地点活动</h3>
              <span class="count">1</span>
              <button class="section-action" type="button">查看全部</button>
            </div>
            <div class="activity-card">
              <div class="activity-top">
                <span class="activity-time">
                  <svg class="icon icon--sm" aria-hidden="true"><use href="./icons.svg#i-clock"></use></svg>
                  今天 15:00–16:55
                </span>
                <span class="status status--ok">已确认</span>
              </div>
              <h4 class="activity-title">东区图书馆 → 南门咖啡下午小聚</h4>
              <p class="activity-meta">7 人已报名 · 2 个站点</p>
            </div>
          </section>

          <div class="rule" style="margin-top:16px"></div>

          <section class="section">
            <div class="section-head">
              <h3 class="section-title">评论</h3>
              <span class="count">2</span>
              <button class="section-action" type="button">查看全部</button>
            </div>
            <div class="comments">
              <article class="comment">
                <div class="comment-head">
                  <span class="comment-name">陈晨</span>
                  <span class="comment-time">10-22 19:27</span>
                </div>
                <p class="comment-text">周末班次少，注意时间。</p>
              </article>
            </div>
          </section>

          <div style="height:14px"></div>
        </div>
      </div>

      <div class="composer">
        <div class="composer-box">
          <input type="text" placeholder="写下评论…" aria-label="写下评论">
        </div>
        <button class="send" type="button" aria-label="发送评论">
          <svg class="icon icon--sm" aria-hidden="true"><use href="./icons.svg#i-send"></use></svg>
        </button>
      </div>
    </section>
  </div>

  <script src="./sample-data.js"></script>
  <script src="./lab.js"></script>
</body>
</html>
